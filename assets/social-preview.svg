<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Warp Kie.ai Endpoint Adapter</title>
  <desc id="desc">OpenAI-compatible HTTPS adapter for Kie.ai Claude models in Warp.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#182846"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#29d3ff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1060" cy="120" r="260" fill="#29d3ff" opacity="0.12"/>
  <circle cx="190" cy="580" r="330" fill="#7c5cff" opacity="0.13"/>
  <g font-family="Arial, Apple Symbols, sans-serif" text-anchor="middle">
    <rect x="508" y="105" width="264" height="40" rx="20" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="640" y="131" font-size="17" font-weight="700" fill="#dbeafe">Warp custom endpoint</text>
    <text x="640" y="244" font-size="64" font-weight="800" fill="#ffffff">Warp Kie.ai</text>
    <text x="640" y="322" font-size="64" font-weight="800" fill="#ffffff">Endpoint Adapter</text>
    <text x="640" y="386" font-size="28" fill="#dce7ff">OpenAI-compatible HTTPS bridge for Kie.ai Claude models</text>
    <g font-size="18" font-weight="700" fill="#eaf2ff">
      <rect x="318" y="452" width="178" height="42" rx="21" fill="#ffffff" fill-opacity="0.10"/>
      <text x="407" y="479">Streaming</text>
      <rect x="526" y="452" width="182" height="42" rx="21" fill="#ffffff" fill-opacity="0.10"/>
      <text x="617" y="479">Text fallback</text>
      <rect x="738" y="452" width="224" height="42" rx="21" fill="#ffffff" fill-opacity="0.10"/>
      <text x="850" y="479">No local key file</text>
    </g>
    <rect x="515" y="526" width="250" height="8" rx="4" fill="url(#accent)"/>
    <text x="640" y="576" font-size="16" fill="#dbeafe" fill-opacity="0.55">github.com/artur-bortsov/warp-endpoint-adapter</text>
  </g>
</svg>
